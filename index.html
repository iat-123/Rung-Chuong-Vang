<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rung Chuông Vàng Mầm Non</title>
    <!-- Font chữ tròn mập đáng yêu cho trẻ em -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #a8edf7 0%, #514a9d 100%);
            font-family: 'Comfortaa', 'Fredoka One', cursive, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow-x: hidden;
        }

        /* Khung chính cân đối */
        .container {
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            border-radius: 35px;
            padding: 30px 40px;
            box-shadow: 0 12px 0px #3d3b73, 0 20px 30px rgba(0,0,0,0.3);
            border: 7px solid #4a90e2;
            text-align: center;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* Số câu hỏi */
        .question-number {
            font-size: clamp(20px, 2.2vw, 26px);
            font-weight: bold;
            color: #ffffff;
            background: #ff6b81;
            padding: 10px 25px;
            border-radius: 50px;
            box-shadow: 0 5px 0px #ee5253;
            letter-spacing: 1px;
        }
        
        /* Đồng hồ đếm giờ */
        .timer-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #feca57;
            padding: 6px 22px 6px 15px;
            border-radius: 50px;
            box-shadow: 0 5px 0px #ff9f43;
            border: 3px solid #fff;
        }

        .timer-icon {
            font-size: clamp(28px, 3vw, 36px);
        }

        .timer {
            font-size: clamp(30px, 3.2vw, 40px);
            font-weight: 900;
            color: #ff4757;
            font-family: 'Fredoka One', cursive;
            min-width: 45px;
            display: inline-block;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .timer.bounce {
            transform: scale(1.35) rotate(-6deg);
            color: #ff0000;
        }

        /* Chữ câu hỏi */
        .question-text {
            font-size: clamp(22px, 2.6vw, 32px);
            color: #2f3542;
            font-weight: bold;
            line-height: 1.3;
            margin: 0;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ảnh câu hỏi */
        .question-img-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question-img {
            max-height: 180px;
            max-width: 100%;
            border-radius: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.12);
            border: 4px solid #ffda79;
            object-fit: contain;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        /* Thẻ đáp án */
        .answer-card {
            background: #f7f1e3;
            border: 4px solid #d1ccc0;
            border-radius: 22px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 6px 0px #aaa69d;
            transition: all 0.2s ease;
        }

        /* Ảnh đáp án */
        .answer-card img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid #fff;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        /* Chữ đáp án */
        .answer-text {
            font-size: clamp(18px, 2vw, 24px);
            color: #2c2c54;
            font-weight: bold;
            text-align: left;
            flex-grow: 1;
        }

        /* Nhãn A, B, C, D */
        .answer-label {
            background: #ff5252;
            color: #ffffff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-family: 'Fredoka One', cursive;
            box-shadow: 0 4px 0px #b33939;
            flex-shrink: 0;
        }

        /* Đáp án đúng */
        .answer-card.correct {
            background: #33d9b2 !important;
            border-color: #218c74 !important;
            box-shadow: 0 6px 0px #218c74 !important;
            transform: translateY(-3px) scale(1.02);
        }

        .answer-card.correct .answer-text,
        .answer-card.correct .answer-label {
            color: white !important;
        }

        .instruction {
            margin-top: 15px;
            text-align: center;
            font-size: clamp(14px, 1.5vw, 17px);
            color: #ffffff;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            z-index: 1;
        }

        /* --- OVERLAY LỚP PHỦ HIỂN THỊ BANNER --- */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .start-overlay.active {
            opacity: 1;
        }

        .cloud-banner {
            position: relative;
            background: #fff200;
            padding: 35px 80px;
            border-radius: 90px;
            border: 9px solid #ff9f1a;
            box-shadow: 0 15px 0px #e67e22, 0 25px 40px rgba(0,0,0,0.35);
            text-align: center;
            animation: cloudPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .cloud-text {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(50px, 7vw, 90px);
            color: #ff3838;
            text-shadow: 4px 4px 0px #ffffff, 8px 8px 0px #c0392b;
            letter-spacing: 3px;
        }

        .cute-decor-left, .cute-decor-right {
            position: absolute;
            top: -55px;
            font-size: clamp(50px, 6vw, 75px);
            animation: cuteJump 0.6s infinite alternate ease-in-out;
        }
        .cute-decor-left { left: -35px; }
        .cute-decor-right { right: -35px; animation-delay: 0.3s; }

        .star-sparkle {
            position: absolute;
            bottom: -25px;
            font-size: clamp(35px, 4vw, 45px);
        }

        @keyframes cloudPop {
            0% {
                transform: scale(0.2) rotate(-15deg);
                opacity: 0;
            }
            70% {
                transform: scale(1.1) rotate(5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        @keyframes cuteJump {
            0% { transform: translateY(0); }
            100% { transform: translateY(-18px); }
        }
    </style>
</head>
<body>

    <!-- Overlay Lớp phủ chung cho Banner -->
    <div class="start-overlay" id="startOverlay">
        <div class="cloud-banner">
            <span class="cute-decor-left" id="bannerIconLeft">🐰</span>
            <span class="cute-decor-right" id="bannerIconRight">🐼</span>
            <div class="cloud-text" id="bannerText">✨ BẮT ĐẦU! ✨</div>
            <span class="star-sparkle" style="left: 30px;">⭐</span>
            <span class="star-sparkle" style="right: 30px;">🌟</span>
        </div>
    </div>

    <div class="container" id="gameContainer">
        <div class="header">
            <div class="question-number" id="qNum">🎈 Sẵn sàng?</div>
            <div class="timer-box">
                <span class="timer-icon">⏰</span>
                <div class="timer" id="timerDisplay">5</div>
            </div>
        </div>
        
        <div class="question-text" id="qText">Nhấn chuột trái vào màn hình để bắt đầu chơi nha! 🐥</div>
        <div class="question-img-container" id="qImgContainer"></div>

        <div class="answers-grid" id="answersGrid"></div>
    </div>

    <div class="instruction">💡 Nhấn chuột trái: Câu tiếp ➔ Bắt đầu ➔ Đếm giờ ➔ Hết giờ ➔ Đáp án</div>

    <script>
        const questions = [
            {
                question: "Con vật nào dưới đây kêu 'Meo meo'?",
                image: "https://images.unsplash.com/photo-1543852786-1cf6624b9987?auto=format&fit=crop&w=400&q=80",
                answers: [
                    { text: "Con Chó", img: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=200&q=80" },
                    { text: "Con Mèo", img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=200&q=80" },
                    { text: "Con Vịt", img: "https://images.unsplash.com/photo-1555685812-4b943f1cb0eb?auto=format&fit=crop&w=200&q=80" },
                    { text: "Con Gà", img: "https://images.unsplash.com/photo-1548550023-2bdb3c5beed7?auto=format&fit=crop&w=200&q=80" }
                ],
                correct: 1
            },
            {
                question: "Quả nào có màu đỏ và vị ngọt, hay được làm bánh kẹo?",
                image: "https://images.unsplash.com/photo-1610832958506-aa56368176cf?auto=format&fit=crop&w=400&q=80",
                answers: [
                    { text: "Quả Chuối", img: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?auto=format&fit=crop&w=200&q=80" },
                    { text: "Quả Dưa Hấu", img: "https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&w=200&q=80" },
                    { text: "Quả Dâu Tây", img: "https://images.unsplash.com/photo-1464965911861-746a04b4bca6?auto=format&fit=crop&w=200&q=80" },
                    { text: "Quả Chanh", img: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=200&q=80" }
                ],
                correct: 2
            },
            {
                question: "Phương tiện nào di chuyển trên bầu trời?",
                image: "https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=400&q=80",
                answers: [
                    { text: "Xe Ô Tô", img: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=200&q=80" },
                    { text: "Tàu Hỏa", img: "https://images.unsplash.com/photo-1515165562839-978bbcf182c0?auto=format&fit=crop&w=200&q=80" },
                    { text: "Xe Đạp", img: "https://images.unsplash.com/photo-1485965120184-e220f721d03e?auto=format&fit=crop&w=200&q=80" },
                    { text: "Máy Bay", img: "https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=200&q=80" }
                ],
                correct: 3
            }
        ];

        let currentState = 0; 
        let currentQuestionIndex = -1;
        let timerInterval = null;
        let timeLeft = 5;
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Âm thanh TICK - TOCK đồng hồ
        function playClockSound(isTick) {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                const freq = isTick ? 1200 : 800;
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);

                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + 0.08);
            } catch(e) {}
        }

        // Âm thanh HẾT GIỜ (Nốt Sol 5 ngân vang)
        function playTimeOutSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const oscMain = ctx.createOscillator();
                const gainMain = ctx.createGain();

                oscMain.type = 'sine';
                oscMain.frequency.setValueAtTime(783.99, now);
                oscMain.frequency.exponentialRampToValueAtTime(392.00, now + 1.5);

                gainMain.gain.setValueAtTime(1.0, now);
                gainMain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

                oscMain.connect(gainMain);
                gainMain.connect(ctx.destination);

                oscMain.start(now);
                oscMain.stop(now + 1.5);

                const oscHarmonic = ctx.createOscillator();
                const gainHarmonic = ctx.createGain();

                oscHarmonic.type = 'triangle';
                oscHarmonic.frequency.setValueAtTime(1567.98, now);
                oscHarmonic.frequency.exponentialRampToValueAtTime(783.99, now + 1.2);

                gainHarmonic.gain.setValueAtTime(0.5, now);
                gainHarmonic.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

                oscHarmonic.connect(gainHarmonic);
                gainHarmonic.connect(ctx.destination);

                oscHarmonic.start(now);
                oscHarmonic.stop(now + 1.2);

            } catch(e) {}
        }

        // 1. ÂM THANH KHI BẤM "BẮT ĐẦU!" (Chuỗi nốt rộn ràng dồn dập)
        function playStartSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);

                    gain.gain.setValueAtTime(0.8, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.2);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.2);
                });
            } catch(e) {}
        }

        // 2. ÂM THANH KHI HIỂN THỊ "CÂU 1", "CÂU 2"... (Tiếng Ting - Ting - Ting nhẹ nhàng, trong trẻo khác hẳn)
        function playQuestionBannerSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                // 3 nốt nhạc cao dần nhẹ nhàng (E5 -> G5 -> C6)
                const notes = [659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine'; // Dùng sine cho tiếng ting trong sáng
                    osc.frequency.setValueAtTime(freq, now + idx * 0.12);

                    gain.gain.setValueAtTime(0.7, now + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.25);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.25);
                });
            } catch(e) {}
        }

        // Âm thanh CHIẾN THẮNG KÉO DÀI
        function playCorrectSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00];
                const times = [0, 0.12, 0.24, 0.36, 0.50, 0.65, 0.82];
                const durations = [0.18, 0.18, 0.18, 0.2, 0.25, 0.3, 0.9];

                notes.forEach((freq, idx) => {
                    const osc1 = ctx.createOscillator();
                    const gain1 = ctx.createGain();
                    osc1.type = 'triangle';
                    osc1.frequency.setValueAtTime(freq, now + times[idx]);
                    gain1.gain.setValueAtTime(1.0, now + times[idx]);
                    gain1.gain.exponentialRampToValueAtTime(0.001, now + times[idx] + durations[idx]);
                    osc1.connect(gain1);
                    gain1.connect(ctx.destination);
                    osc1.start(now + times[idx]);
                    osc1.stop(now + times[idx] + durations[idx]);

                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.type = 'sawtooth';
                    osc2.frequency.setValueAtTime(freq, now + times[idx]);
                    gain2.gain.setValueAtTime(0.4, now + times[idx]);
                    gain2.gain.exponentialRampToValueAtTime(0.001, now + times[idx] + durations[idx]);
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.start(now + times[idx]);
                    osc2.stop(now + times[idx] + durations[idx]);
                });
            } catch(e) {}
        }

        document.body.addEventListener('click', () => {
            if (currentState === 0) {
                currentQuestionIndex++;
                if (currentQuestionIndex >= questions.length) {
                    currentQuestionIndex = 0;
                }
                
                // Banner "CÂU X" phát âm thanh Ting - Ting - Ting
                triggerBanner(`CÂU ${currentQuestionIndex + 1}`, "🐱", "🐶", playQuestionBannerSound);
                showQuestion(currentQuestionIndex);
                currentState = 1;
            } 
            else if (currentState === 1) {
                // Banner "BẮT ĐẦU!" phát âm thanh sôi động
                triggerBanner("✨ BẮT ĐẦU! ✨", "🐰", "🐼", playStartSound);
                
                currentState = 2;
                setTimeout(() => {
                    if (currentState === 2) {
                        startTimer();
                    }
                }, 1000); 
            }
            else if (currentState === 2) {
                clearInterval(timerInterval);
                document.getElementById('timerDisplay').innerText = "0";
                playTimeOutSound();
                currentState = 3;
            }
            else if (currentState === 3) {
                playCorrectSound();
                highlightCorrectAnswer();
                currentState = 4;
            }
            else if (currentState === 4) {
                currentState = 0;
                currentQuestionIndex++;
                if (currentQuestionIndex >= questions.length) {
                    currentQuestionIndex = 0;
                    document.getElementById('qNum').innerText = "🎉 Hoàn thành!";
                    document.getElementById('qText').innerText = "Chúc mừng các bé! Nhấn chuột để chơi lại từ đầu nhé! 🌟";
                    document.getElementById('qImgContainer').innerHTML = "";
                    document.getElementById('answersGrid').innerHTML = "";
                    document.getElementById('timerDisplay').innerText = "5";
                    return;
                }
                // Banner "CÂU X" phát âm thanh Ting - Ting - Ting
                triggerBanner(`CÂU ${currentQuestionIndex + 1}`, "🐱", "🐶", playQuestionBannerSound);
                showQuestion(currentQuestionIndex);
                currentState = 1;
            }
        });

        // Hàm gọi Banner linh hoạt kèm hàm phát âm thanh tương ứng
        function triggerBanner(text, iconLeft, iconRight, soundFunction) {
            if (soundFunction) {
                soundFunction();
            }
            document.getElementById('bannerText').innerText = text;
            document.getElementById('bannerIconLeft').innerText = iconLeft || "🐰";
            document.getElementById('bannerIconRight').innerText = iconRight || "🐼";

            const overlay = document.getElementById('startOverlay');
            overlay.classList.add('active');
            
            setTimeout(() => {
                overlay.classList.remove('active');
            }, 1000);
        }

        function showQuestion(index) {
            const q = questions[index];
            document.getElementById('qNum').innerText = `Câu ${index + 1} / ${questions.length}`;
            document.getElementById('timerDisplay').innerText = "5";
            document.getElementById('qText').innerText = q.question;
            
            const imgContainer = document.getElementById('qImgContainer');
            if (q.image) {
                imgContainer.innerHTML = `<img src="${q.image}" class="question-img" alt="Question Image">`;
            } else {
                imgContainer.innerHTML = "";
            }

            const labels = ['A', 'B', 'C', 'D'];
            const grid = document.getElementById('answersGrid');
            grid.innerHTML = "";

            q.answers.forEach((ans, idx) => {
                grid.innerHTML += `
                    <div class="answer-card" id="answer-${idx}">
                        <div class="answer-label">${labels[idx]}</div>
                        <img src="${ans.img}" alt="Answer Image">
                        <div class="answer-text">${ans.text}</div>
                    </div>
                `;
            });
        }

        function startTimer() {
            timeLeft = 5;
            const timerEl = document.getElementById('timerDisplay');
            timerEl.innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;

                timerEl.classList.add('bounce');
                setTimeout(() => {
                    timerEl.classList.remove('bounce');
                }, 200);

                if (timeLeft > 0) {
                    playClockSound(timeLeft % 2 !== 0);
                } else {
                    clearInterval(timerInterval);
                    playTimeOutSound();
                    currentState = 3;
                }
            }, 1000);
        }

        function highlightCorrectAnswer() {
            const q = questions[currentQuestionIndex];
            const correctCard = document.getElementById(`answer-${q.correct}`);
            if (correctCard) {
                correctCard.classList.add('correct');
            }
        }
    </script>
</body>
</html>
