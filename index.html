<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rung Chuông Vàng Mầm Non - Nhận Biết Hình Học</title>
    <!-- Font chữ tròn mập đáng yêu cho trẻ em -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #a8edf7 0%, #514a9d 100%);
            font-family: 'Comfortaa', 'Fredoka One', cursive, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow-x: hidden;
        }

        /* Khung chính cân đối */
        .container {
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            border-radius: 35px;
            padding: 25px 40px;
            box-shadow: 0 12px 0px #3d3b73, 0 20px 30px rgba(0,0,0,0.3);
            border: 7px solid #4a90e2;
            text-align: center;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* Số câu hỏi */
        .question-number {
            font-size: clamp(20px, 2.2vw, 26px);
            font-weight: bold;
            color: #ffffff;
            background: #ff6b81;
            padding: 8px 25px;
            border-radius: 50px;
            box-shadow: 0 5px 0px #ee5253;
            letter-spacing: 1px;
        }
        
        /* Đồng hồ đếm giờ */
        .timer-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #feca57;
            padding: 6px 22px 6px 15px;
            border-radius: 50px;
            box-shadow: 0 5px 0px #ff9f43;
            border: 3px solid #fff;
        }

        .timer-icon {
            font-size: clamp(28px, 3vw, 36px);
        }

        .timer {
            font-size: clamp(30px, 3.2vw, 40px);
            font-weight: 900;
            color: #ff4757;
            font-family: 'Fredoka One', cursive;
            min-width: 45px;
            display: inline-block;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .timer.bounce {
            transform: scale(1.35) rotate(-6deg);
            color: #ff0000;
        }

        /* Chữ câu hỏi (thơ đa dòng) */
        .question-text {
            font-size: clamp(20px, 2.4vw, 28px);
            color: #2f3542;
            font-weight: bold;
            line-height: 1.4;
            margin: 0;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            white-space: pre-line;
        }

        /* Vùng chứa hình vẽ câu hỏi (chỉ có viền, không đổ màu) */
        .question-img-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 130px;
        }

        .question-shape {
            width: 120px;
            height: 120px;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        /* Thẻ đáp án */
        .answer-card {
            background: #f7f1e3;
            border: 4px solid #d1ccc0;
            border-radius: 22px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 6px 0px #aaa69d;
            transition: all 0.2s ease;
        }

        /* Hình vẽ đáp án (có đổ màu) */
        .answer-card svg {
            width: 65px;
            height: 65px;
            flex-shrink: 0;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.15));
        }

        /* Chữ đáp án */
        .answer-text {
            font-size: clamp(18px, 2vw, 24px);
            color: #2c2c54;
            font-weight: bold;
            text-align: left;
            flex-grow: 1;
        }

        /* Nhãn A, B, C, D */
        .answer-label {
            background: #ff5252;
            color: #ffffff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-family: 'Fredoka One', cursive;
            box-shadow: 0 4px 0px #b33939;
            flex-shrink: 0;
        }

        /* Đáp án đúng */
        .answer-card.correct {
            background: #33d9b2 !important;
            border-color: #218c74 !important;
            box-shadow: 0 6px 0px #218c74 !important;
            transform: translateY(-3px) scale(1.02);
        }

        .answer-card.correct .answer-text,
        .answer-card.correct .answer-label {
            color: white !important;
        }

        .instruction {
            margin-top: 10px;
            text-align: center;
            font-size: clamp(14px, 1.5vw, 17px);
            color: #ffffff;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            z-index: 1;
        }

        /* --- OVERLAY BANNER --- */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .start-overlay.active {
            opacity: 1;
        }

        .cloud-banner.start-style {
            background: linear-gradient(180deg, #ff7675 0%, #ff6b81 100%);
            padding: 22px 60px;
            border-radius: 60px;
            border: 6px solid #fffa65;
            box-shadow: 0 10px 0px #d63031, 0 18px 30px rgba(0,0,0,0.35);
            text-align: center;
            position: relative;
            animation: cloudPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .cloud-banner.start-style .cloud-text {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(38px, 5vw, 68px);
            color: #fffa65;
            text-shadow: 3px 3px 0px #c0392b, 6px 6px 0px #780e03;
            letter-spacing: 2px;
        }

        .cloud-banner.question-style {
            background: #00bec4;
            padding: 25px 70px;
            border-radius: 50px;
            border: 7px solid #2ed573;
            box-shadow: 0 12px 0px #10ac84, 0 20px 35px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            animation: questionSlide 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .cloud-banner.question-style .cloud-text {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(42px, 5.5vw, 75px);
            color: #ffffff;
            text-shadow: 3px 3px 0px #0b8a6a, 6px 6px 0px #055e48;
            letter-spacing: 3px;
        }

        .start-style .cute-decor-left, 
        .start-style .cute-decor-right {
            top: -42px;
            font-size: clamp(40px, 4.8vw, 60px);
        }
        .question-style .cute-decor-left, 
        .question-style .cute-decor-right {
            top: -48px;
            font-size: clamp(45px, 5.2vw, 68px);
        }

        .cute-decor-left { left: -28px; animation: cuteJump 0.6s infinite alternate ease-in-out; }
        .cute-decor-right { right: -28px; animation: cuteJump 0.6s infinite alternate ease-in-out; animation-delay: 0.3s; }

        .star-sparkle {
            position: absolute;
            bottom: -20px;
            font-size: clamp(28px, 3.2vw, 38px);
        }

        @keyframes cloudPop {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            70% { transform: scale(1.08) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes questionSlide {
            0% { transform: translateY(-70px) scale(0.5); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes cuteJump {
            0% { transform: translateY(0); }
            100% { transform: translateY(-14px); }
        }
    </style>
</head>
<body>

    <div class="start-overlay" id="startOverlay">
        <div class="cloud-banner start-style" id="bannerBox">
            <span class="cute-decor-left" id="bannerIconLeft">🐰</span>
            <span class="cute-decor-right" id="bannerIconRight">🐼</span>
            <div class="cloud-text" id="bannerText">✨ BẮT ĐẦU! ✨</div>
            <span class="star-sparkle" style="left: 25px;">⭐</span>
            <span class="star-sparkle" style="right: 25px;">🌟</span>
        </div>
    </div>

    <div class="container" id="gameContainer">
        <div class="header">
            <div class="question-number" id="qNum">🎈 Sẵn sàng?</div>
            <div class="timer-box">
                <span class="timer-icon">⏰</span>
                <div class="timer" id="timerDisplay">5</div>
            </div>
        </div>
        
        <div class="question-text" id="qText">Nhấn chuột trái vào màn hình để bắt đầu chơi nha! 🐥</div>
        <div class="question-img-container" id="qImgContainer"></div>

        <div class="answers-grid" id="answersGrid"></div>
    </div>

    <div class="instruction">💡 Nhấn chuột trái: Câu tiếp ➔ Bắt đầu ➔ Đếm giờ ➔ Hết giờ ➔ Đáp án</div>

    <script>
        const svgOutlines = {
            triangle: `<svg viewBox="0 0 100 100"><polygon points="50,10 95,90 5,90" fill="none" stroke="#2f3542" stroke-width="6" stroke-linejoin="round"/></svg>`,
            circle: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#2f3542" stroke-width="6"/></svg>`,
            square: `<svg viewBox="0 0 100 100"><rect x="15" y="15" width="70" height="70" fill="none" stroke="#2f3542" stroke-width="6" rx="8"/></svg>`,
            rectangle: `<svg viewBox="0 0 100 100"><rect x="10" y="25" width="80" height="50" fill="none" stroke="#2f3542" stroke-width="6" rx="8"/></svg>`
        };

        const svgFilled = {
            triangle: `<svg viewBox="0 0 100 100"><polygon points="50,10 95,90 5,90" fill="#ff4757" stroke="#2f3542" stroke-width="5" stroke-linejoin="round"/></svg>`,
            circle: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#2ed573" stroke="#2f3542" stroke-width="5"/></svg>`,
            square: `<svg viewBox="0 0 100 100"><rect x="15" y="15" width="70" height="70" fill="#1e90ff" stroke="#2f3542" stroke-width="5" rx="8"/></svg>`,
            rectangle: `<svg viewBox="0 0 100 100"><rect x="10" y="25" width="80" height="50" fill="#ffa502" stroke="#2f3542" stroke-width="5" rx="8"/></svg>`
        };

        const questions = [
            {
                question: "Tôi có 3 cạnh\nTrông giống mái nhà\nMời bạn đoán xem\nTôi là hình gì?",
                shape: svgOutlines.triangle,
                answers: [
                    { text: "Hình Tròn", svg: svgFilled.circle },
                    { text: "Hình Tam Giác", svg: svgFilled.triangle },
                    { text: "Hình Vuông", svg: svgFilled.square },
                    { text: "Hình Chữ Nhật", svg: svgFilled.rectangle }
                ],
                correct: 1
            },
            {
                question: "Hình gì lăn được\nLăn ngược lăn xuôi\nBé hãy cùng cô\nĐoán hình này nhé?",
                shape: svgOutlines.circle,
                answers: [
                    { text: "Hình Tam Giác", svg: svgFilled.triangle },
                    { text: "Hình Vuông", svg: svgFilled.square },
                    { text: "Hình Tròn", svg: svgFilled.circle },
                    { text: "Hình Chữ Nhật", svg: svgFilled.rectangle }
                ],
                correct: 2
            },
            {
                question: "Bao quanh đường thẳng\n4 cạnh bằng nhau\nBé hãy đoán mau\nTôi là hình gì?",
                shape: svgOutlines.square,
                answers: [
                    { text: "Hình Vuông", svg: svgFilled.square },
                    { text: "Hình Tròn", svg: svgFilled.circle },
                    { text: "Hình Tam Giác", svg: svgFilled.triangle },
                    { text: "Hình Chữ Nhật", svg: svgFilled.rectangle }
                ],
                correct: 0
            },
            {
                question: "Có 2 cạnh dài\nVà 2 cạnh ngắn\nXinh xắn làm sao\nBạn đoán xem nào\nHình gì đó nhỉ?",
                shape: svgOutlines.rectangle,
                answers: [
                    { text: "Hình Tròn", svg: svgFilled.circle },
                    { text: "Hình Vuông", svg: svgFilled.square },
                    { text: "Hình Chữ Nhật", svg: svgFilled.rectangle },
                    { text: "Hình Tam Giác", svg: svgFilled.triangle }
                ],
                correct: 2
            }
        ];

        let currentState = 0; 
        let currentQuestionIndex = -1;
        let timerInterval = null;
        let timeLeft = 5;
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playClockSound(isTick) {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                const freq = isTick ? 1200 : 800;
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);

                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + 0.08);
            } catch(e) {}
        }

        function playTimeOutSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const oscMain = ctx.createOscillator();
                const gainMain = ctx.createGain();

                oscMain.type = 'sine';
                oscMain.frequency.setValueAtTime(783.99, now);
                oscMain.frequency.exponentialRampToValueAtTime(392.00, now + 1.5);

                gainMain.gain.setValueAtTime(1.0, now);
                gainMain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

                oscMain.connect(gainMain);
                gainMain.connect(ctx.destination);

                oscMain.start(now);
                oscMain.stop(now + 1.5);

                const oscHarmonic = ctx.createOscillator();
                const gainHarmonic = ctx.createGain();

                oscHarmonic.type = 'triangle';
                oscHarmonic.frequency.setValueAtTime(1567.98, now);
                oscHarmonic.frequency.exponentialRampToValueAtTime(783.99, now + 1.2);

                gainHarmonic.gain.setValueAtTime(0.5, now);
                gainHarmonic.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

                oscHarmonic.connect(gainHarmonic);
                gainHarmonic.connect(ctx.destination);

                oscHarmonic.start(now);
                oscHarmonic.stop(now + 1.2);
            } catch(e) {}
        }

        function playStartSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);

                    gain.gain.setValueAtTime(0.8, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.2);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.2);
                });
            } catch(e) {}
        }

        function playQuestionBannerSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const notes = [659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.12);

                    gain.gain.setValueAtTime(0.7, now + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.25);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.25);
                });
            } catch(e) {}
        }

        function playCorrectSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00];
                const times = [0, 0.12, 0.24, 0.36, 0.50, 0.65, 0.82];
                const durations = [0.18, 0.18, 0.18, 0.2, 0.25, 0.3, 0.9];

                notes.forEach((freq, idx) => {
                    const osc1 = ctx.createOscillator();
                    const gain1 = ctx.createGain();
                    osc1.type = 'triangle';
                    osc1.frequency.setValueAtTime(freq, now + times[idx]);
                    gain1.gain.setValueAtTime(1.0, now + times[idx]);
                    gain1.gain.exponentialRampToValueAtTime(0.001, now + times[idx] + durations[idx]);
                    osc1.connect(gain1);
                    gain1.connect(ctx.destination);
                    osc1.start(now + times[idx]);
                    osc1.stop(now + times[idx] + durations[idx]);

                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.type = 'sawtooth';
                    osc2.frequency.setValueAtTime(freq, now + times[idx]);
                    gain2.gain.setValueAtTime(0.4, now + times[idx]);
                    gain2.gain.exponentialRampToValueAtTime(0.001, now + times[idx] + durations[idx]);
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.start(now + times[idx]);
                    osc2.stop(now + times[idx] + durations[idx]);
                });
            } catch(e) {}
        }

        document.body.addEventListener('click', () => {
            if (currentState === 0) {
                currentQuestionIndex++;
                if (currentQuestionIndex >= questions.length) {
                    currentQuestionIndex = 0;
                }
                
                triggerBanner(`CÂU ${currentQuestionIndex + 1}`, "🐱", "🐶", playQuestionBannerSound, "question-style");
                showQuestion(currentQuestionIndex);
                currentState = 1;
            } 
            else if (currentState === 1) {
                triggerBanner("✨ BẮT ĐẦU! ✨", "🐰", "🐼", playStartSound, "start-style");
                
                currentState = 2;
                setTimeout(() => {
                    if (currentState === 2) {
                        startTimer();
                    }
                }, 1000); 
            }
            else if (currentState === 2) {
                clearInterval(timerInterval);
                document.getElementById('timerDisplay').innerText = "0";
                playTimeOutSound();
                currentState = 3;
            }
            else if (currentState === 3) {
                playCorrectSound();
                highlightCorrectAnswer();
                currentState = 4;
            }
            else if (currentState === 4) {
                currentState = 0;
                currentQuestionIndex++;
                if (currentQuestionIndex >= questions.length) {
                    currentQuestionIndex = 0;
                    document.getElementById('qNum').innerText = "🎉 Hoàn thành!";
                    document.getElementById('qText').innerText = "Chúc mừng các bé! Nhấn chuột để chơi lại từ đầu nhé! 🌟";
                    document.getElementById('qImgContainer').innerHTML = "";
                    document.getElementById('answersGrid').innerHTML = "";
                    document.getElementById('timerDisplay').innerText = "5";
                    return;
                }
                triggerBanner(`CÂU ${currentQuestionIndex + 1}`, "🐱", "🐶", playQuestionBannerSound, "question-style");
                showQuestion(currentQuestionIndex);
                currentState = 1;
            }
        });

        function triggerBanner(text, iconLeft, iconRight, soundFunction, styleClass) {
            if (soundFunction) {
                soundFunction();
            }
            
            const bannerBox = document.getElementById('bannerBox');
            bannerBox.className = `cloud-banner ${styleClass || 'start-style'}`;
            
            document.getElementById('bannerText').innerText = text;
            document.getElementById('bannerIconLeft').innerText = iconLeft || "🐰";
            document.getElementById('bannerIconRight').innerText = iconRight || "🐼";

            const overlay = document.getElementById('startOverlay');
            overlay.classList.add('active');
            
            setTimeout(() => {
                overlay.classList.remove('active');
            }, 1000);
        }

        function showQuestion(index) {
            const q = questions[index];
            document.getElementById('qNum').innerText = `Câu ${index + 1} / ${questions.length}`;
            document.getElementById('timerDisplay').innerText = "5";
            document.getElementById('qText').innerText = q.question;
            
            const imgContainer = document.getElementById('qImgContainer');
            if (q.shape) {
                imgContainer.innerHTML = `<div class="question-shape">${q.shape}</div>`;
            } else {
                imgContainer.innerHTML = "";
            }

            const labels = ['A', 'B', 'C', 'D'];
            const grid = document.getElementById('answersGrid');
            grid.innerHTML = "";

            q.answers.forEach((ans, idx) => {
                grid.innerHTML += `
                    <div class="answer-card" id="answer-${idx}">
                        <div class="answer-label">${labels[idx]}</div>
                        ${ans.svg}
                        <div class="answer-text">${ans.text}</div>
                    </div>
                `;
            });
        }

        function startTimer() {
            timeLeft = 5;
            const timerEl = document.getElementById('timerDisplay');
            timerEl.innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;

                timerEl.classList.add('bounce');
                setTimeout(() => {
                    timerEl.classList.remove('bounce');
                }, 200);

                if (timeLeft > 0) {
                    playClockSound(timeLeft % 2 !== 0);
                } else {
                    clearInterval(timerInterval);
                    playTimeOutSound();
                    currentState = 3;
                }
            }, 1000);
        }

        function highlightCorrectAnswer() {
            const q = questions[currentQuestionIndex];
            const correctCard = document.getElementById(`answer-${q.correct}`);
            if (correctCard) {
                correctCard.classList.add('correct');
            }
        }
    </script>
</body>
</html>
